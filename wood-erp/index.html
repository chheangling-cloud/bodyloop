  <script>
    // 语言早期应用
    (function() {
      try {
        var lang = localStorage.getItem('wood_erp_lang');
        if (lang !== 'zh-CN' && lang !== 'en-US') lang = 'zh-CN';
        document.documentElement.setAttribute('lang', lang);
      } catch(e) {}
    })();
  </script>
  <!-- 字体加载(双 CDN:Google 优先,jsdelivr 兜底以应对网络受限环境) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- jsdelivr 兜底(大陆友好) -->
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.css" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <script>
    // 字体加载诊断 - 控制台报告
    if (document.fonts) {
      document.fonts.ready.then(() => {
        const loaded = new Set();
        document.fonts.forEach(f => loaded.add(f.family));
        const hasInter = loaded.has('Inter');
        const hasMono  = loaded.has('JetBrains Mono');
        if (hasInter && hasMono) {
          console.log('%c✓ 字体加载成功: Inter + JetBrains Mono', 'color:#10b981');
        } else {
          console.warn('⚠ 字体未完全加载,当前 fallback 到系统字体:', { Inter: hasInter, JetBrainsMono: hasMono });
          console.warn('  网络问题导致 Google Fonts / jsdelivr 都失败时,会使用系统默认字体(等宽字体看起来会更粗、字距较宽)');
        }
      });
    }
  </script>
</head>

<script>
  // 启动:种子数据 + Session + 路由
  (function bootstrap() {
    // === schema 版本检测 ===
    // 每次 seed 数据结构有大改动时,把 SCHEMA_VERSION 加 1
    // 浏览器 localStorage 里的版本号不匹配 → 自动重置
    const SCHEMA_VERSION = '5.2';   // v5.2=物流大改造:车辆主数据 + DN 编号 + vehicleId + 运费字段
    const storedVersion = Storage.getPref('senda_schema_version');
    if (storedVersion !== SCHEMA_VERSION) {
      console.log(`[Bootstrap] Schema 版本变化: ${storedVersion} → ${SCHEMA_VERSION},自动重置数据`);
      const keysToRemove = Storage.keysWithPrefix('senda_');
      keysToRemove.forEach(k => Storage.removeData(k));
      Storage.setPref('senda_schema_version', SCHEMA_VERSION);
    }
    // 数据库为空 → seed
    if (DB.find('salesOrders').length === 0) {
      Seed.buildAndSeed();
    }
    // Session 必须在 seed 之后(因为依赖 employees 表)
    Session.init();

    // 自动归档:90 天以前的库存流水
    try {
      const n = ArchiveService.autoArchiveStockMovements(90);
      if (n > 0) console.log(`[Bootstrap] 自动归档 ${n} 条 90+ 天的库存流水`);
    } catch (e) { console.warn('[Bootstrap] 自动归档失败:', e); }

    Router.start();
  })();
</script>
